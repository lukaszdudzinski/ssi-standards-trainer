name: Testy i publikacja

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testy statyczne, bazy pytań i service workera
        run: npm test
      - name: Przeglądarki Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Testy e2e
        run: npx playwright test
      - name: Raport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ta sama lista plików co dziś (Pages z gałęzi/Jekyll pomija pliki z kropką); bez nowej infrastruktury testów.
      - name: Przygotuj zawartość publikacji
        run: |
          git -c core.quotePath=false ls-files | grep -vE '^(\.|tests/|playwright\.config\.js$)' > "$RUNNER_TEMP/publish-list.txt"
          mkdir _site
          rsync -a --files-from="$RUNNER_TEMP/publish-list.txt" ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
